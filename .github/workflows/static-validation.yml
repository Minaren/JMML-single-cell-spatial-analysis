name: Static validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run dependency-free release checks
        run: python code_publication/tests/static_validation.py
      - name: Check repository whitespace
        run: git diff --check

  cellphonedb-input-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code_publication/environment/requirements-cellphonedb-lock.txt
      - name: Install input-preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 pandas==2.2.3 scipy==1.13.1 \
            h5py==3.16.0 anndata==0.10.9
      - name: Test sparse orthologue conversion and h5ad output
        run: python code_publication/tests/test_prepare_cellphonedb_inputs.py

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
      - name: Parse maintained R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("code_publication", pattern = "[.]R$", recursive = TRUE,
                              full.names = TRUE)
          failures <- vapply(files, function(path) {
            tryCatch({ parse(file = path); FALSE }, error = function(e) {
              message(path, ": ", conditionMessage(e)); TRUE
            })
          }, logical(1))
          if (any(failures)) stop("R syntax validation failed")
